name: 📝 Journal Entry

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: journal-data
  cancel-in-progress: false

jobs:
  ingest:
    # 저장소 주인이 일지 템플릿으로 쓴 이슈만 처리 (공개 저장소에서 남이 쓴 글이 페이지에 올라가지 않게)
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'journal') || startsWith(github.event.issue.title, '[일지]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 의존성
        run: pip install pandas

      - name: 📝 일지 파싱
        id: ingest
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_UPDATED_AT: ${{ github.event.issue.updated_at }}
          COMMENT_OUT: ${{ runner.temp }}/comment.md
        run: |
          set +e
          python journal/ingest_issue.py > "$RUNNER_TEMP/out.txt"
          code=$?
          cat "$RUNNER_TEMP/out.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          id=$(sed -n 's/^ENTRY_ID=//p' "$RUNNER_TEMP/out.txt" | head -1)
          echo "entry_id=$id" >> "$GITHUB_OUTPUT"

      - name: 🧮 분석 · 댓글 작성
        if: steps.ingest.outputs.code == '0'
        env:
          ENTRY_ID: ${{ steps.ingest.outputs.entry_id }}
        run: python journal/analyze.py --comment "$ENTRY_ID" --comment-out "$RUNNER_TEMP/comment.md"

      - name: 💾 커밋 & 푸시
        if: steps.ingest.outputs.code == '0'
        env:
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/journal
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "📝 시장 일지 #$NUM"
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: 💬 이슈에 결과 달고 닫기
        if: always() && steps.ingest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          CODE: ${{ steps.ingest.outputs.code }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          if [ "$CODE" = "0" ]; then gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"; fi
