<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>직종별 현장 지원 아이템</title>
<style>
:root{
  --bg:#0A1A2F; --card:#16263D; --card2:#1B2F4A; --line:#27405F;
  --or:#FF6B1A; --sub:#AAB7C4; --tx:#FFFFFF;
  --good:#2c8a5f; --warn:#c89010; --bad:#b3402a;
  --sz-s:#FFA05C; --sz-m:#4C86C6; --sz-l:#8FA3B8; --own:#5EC3C8;
  --font:"Pretendard Variable",Pretendard,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.55;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:#8CC4FF}
section.pg{min-height:100vh;scroll-snap-align:start;padding:24px 64px 30px 40px;display:flex;flex-direction:column;gap:11px;position:relative}
.eyebrow{font-size:12px;color:var(--or);font-weight:700;letter-spacing:.06em}
.ttl{font-size:23px;font-weight:800;line-height:1.3}
.lead{color:var(--sub);font-size:14px;max-width:1000px;margin:0}
.lead b{color:var(--tx)}
.hint{font-size:12px;color:var(--sub)}
.row{display:flex;gap:14px;align-items:stretch}
.card{background:var(--card);border-radius:8px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.card.lb{border-left:3px solid var(--or)}
.demo{display:none}
/* top meta */
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:8px}
.meta b{color:var(--tx);font-weight:600}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--card);border-radius:8px;padding:9px 14px;border-top:3px solid var(--line)}
.tile .n{font-size:26px;font-weight:800;line-height:1.1}
.tile .n small{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px}
.tile .k{font-size:12.5px;color:var(--sub);margin-top:2px}
/* badges */
.bd{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 7px;line-height:1.6;white-space:nowrap}
.sz-소{background:rgba(255,160,92,.16);color:var(--sz-s);border:1px solid rgba(255,160,92,.5)}
.sz-중{background:rgba(76,134,198,.18);color:#7FB0E6;border:1px solid rgba(76,134,198,.6)}
.sz-대{background:rgba(143,163,184,.16);color:#C3D0DC;border:1px solid rgba(143,163,184,.55)}
.ct{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.ct i{width:9px;height:9px;border-radius:50%;display:inline-block}
.ct-직접 i{background:var(--good)} .ct-경유 i{background:var(--warn)} .ct-회사 i{background:var(--bad)}
.pf{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}
.pf-A{background:#1f4d3a;color:#8fe0b8}
.pf-B{background:#4a3d14;color:#f0cd6a}
.pf-C{background:#3a2a28;color:#e6a596}
.pf-제안{background:#2a2f3d;color:#c9d2de;border:1px dashed #6C8299}
.star{color:var(--or);font-weight:800}
/* map grid */
.map{display:grid;gap:6px;grid-template-columns:62px repeat(var(--cols),1fr)}
.map .hd{font-size:12px;color:var(--sub);font-weight:700;text-align:center;padding:4px 2px;border-bottom:1px solid var(--line)}
.map .rh{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border-radius:6px}
.map .cell{background:var(--card);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:64px}
.chip{display:flex;align-items:flex-start;gap:6px;background:var(--card2);border-radius:5px;padding:5px 7px;font-size:12.3px;line-height:1.35;cursor:pointer;border:1px solid transparent}
.chip:hover,.chip:focus-visible{border-color:var(--or);outline:none}
.chip i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:4px}
.chip.top{box-shadow:inset 3px 0 0 var(--or)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--sub);align-items:center}
/* tabs + table */
.tabs{display:flex;gap:6px}
.tab{background:var(--card);color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--or);color:#fff;border-color:var(--or)}
table.it{width:100%;border-collapse:collapse;font-size:13px}
table.it th{font-size:12px;color:var(--sub);text-align:left;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.it td{padding:6px 8px;border-bottom:1px solid rgba(39,64,95,.6);vertical-align:top;line-height:1.45}
table.it tbody tr{cursor:pointer}
table.it tbody tr:hover td,table.it tbody tr:focus-visible td{background:rgba(255,107,26,.07);outline:none}
.nm{font-weight:700}
.nm small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:1px}
.case{color:var(--sub);font-size:12.5px}
.case b{color:var(--tx);font-weight:600}
/* channels */
.cols3{display:grid;grid-template-columns:1.1fr 1fr 1.05fr;gap:12px;align-items:start}
.cl h3{font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cl ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.cl li{font-size:12.4px;line-height:1.42;padding-bottom:6px;border-bottom:1px solid rgba(39,64,95,.6)}
.cl li:last-child{border-bottom:0;padding-bottom:0}
.cl li b{font-size:13px}
.cl li .u{display:block;color:#8CC4FF;font-size:11.5px;word-break:break-all}
.cl li .s{color:var(--sub)}
.ow{display:inline-block;font-size:10.5px;font-weight:700;border-radius:3px;padding:0 5px;line-height:1.6;white-space:nowrap;vertical-align:1px}
.ow-운용{background:var(--own);color:#0A1A2F}
.ow-시범{border:1px solid var(--own);color:var(--own)}
.ow-없음{color:#6C8299;border:1px solid #3a4f68}
.own-col{border-top:3px solid var(--own)}
.expo{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.4px;align-items:baseline;padding:2px 2px}
.expo > b{color:var(--or);font-size:12.6px}
.expo a{color:var(--tx);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--sub)}
.inhouse{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.6px;padding:9px 14px;align-items:baseline}
.inhouse > b{font-size:13px;color:var(--or);margin-right:4px}
.inhouse span{color:var(--sub)} .inhouse span b{color:var(--tx);font-weight:600}
/* plan */
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plan .card h3{font-size:14.5px;margin-bottom:6px}
.plan ol{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.plan .when{font-size:12px;color:var(--or);font-weight:700}
.dec{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dec .card{border-top:3px solid var(--or)}
.dec .q{font-weight:700;font-size:14px;margin-bottom:4px}
.dec .a{font-size:12.6px;color:var(--sub)}
.lim{font-size:12px;line-height:1.45;color:var(--sub);display:flex;flex-direction:column;gap:1px;margin:0;padding-left:16px}
/* modal */
.mb{position:fixed;inset:0;background:rgba(3,10,20,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.mb.on{display:flex}
.md{background:var(--card);border-radius:10px;max-width:880px;width:100%;max-height:calc(100vh - 40px);overflow:auto;padding:22px 26px;border-top:3px solid var(--or);position:relative}
.md h2{font-size:20px;margin:6px 0 4px}
.md .x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--sub);font-size:22px;cursor:pointer}
.md h4{font-size:13px;color:var(--or);margin:16px 0 6px}
.md p{margin:0 0 6px;font-size:13.5px}
.md .cs{background:var(--card2);border-radius:6px;padding:9px 12px;margin-bottom:7px;font-size:13px}
.md .cs .src{display:block;font-size:11.5px;color:#8CC4FF;word-break:break-all;margin-top:3px}
.md .vd{font-size:13px;margin-bottom:5px}
.md .vd .u{font-size:11.5px;color:#8CC4FF;word-break:break-all}
/* nav */
.dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:20}
.dots button{width:10px;height:10px;border-radius:50%;border:1px solid var(--sub);background:transparent;padding:0;cursor:pointer}
.dots button.on{background:var(--or);border-color:var(--or)}
.prog{position:fixed;left:0;bottom:0;height:3px;background:var(--or);width:0;z-index:20;transition:width .2s}
.pgno{position:absolute;right:64px;bottom:8px;font-size:11px;color:var(--sub)}
.print-only{display:none}
@media (max-width:900px){
  html{scroll-snap-type:none}
  section.pg{padding:24px 16px 40px;min-height:auto}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .cols3,.plan,.dec{grid-template-columns:1fr}
  .map{grid-template-columns:44px repeat(var(--cols),minmax(120px,1fr));overflow-x:auto}
  .mapwrap{overflow-x:auto}
  .dots,.pgno{display:none}
  table.it .hide-m{display:none}
}
@media print{
  html{scroll-snap-type:none}
  body{background:#fff;color:#111;font-size:11px}
  section.pg{min-height:auto;page-break-after:always;padding:12px 6px}
  .card,.tile,.map .cell,.chip,.md .cs{background:#fff;box-shadow:none;border:1px solid #ccd}
  .lead,.hint,.meta,.case,.tile .k,.cl li .s,.dec .a,.lim{color:#444}
  .tile .n,.nm,.ttl{color:#111}
  .dots,.prog,.mb,.tabs,.pgno{display:none!important}
  table.it tbody tr{display:table-row!important}
  .print-only{display:block}
  a,.u,.src{color:#1a4f8a!important}
}

.trd{display:inline-block;font-size:11px;font-weight:700;border-radius:3px;padding:0 6px;line-height:1.6;background:#24395a;color:#cfe0f5;white-space:nowrap}
.pn{display:inline-block;font-size:11px;border-radius:3px;padding:0 5px;line-height:1.6;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.pf-미확인{background:#2a2f3d;color:#c9d2de;border:1px dashed #6C8299}
.map .hd small{display:block;font-weight:400;font-size:10.5px;color:#7f93a8}
.map .rh{background:var(--card2);color:var(--tx);font-size:14px}
.map{grid-template-columns:64px repeat(var(--cols),1fr)}
.chain{display:flex;flex-direction:column;gap:6px}
.chh{font-size:14px}
.chh b{color:var(--or)}
.flow{display:flex;align-items:stretch;gap:6px}
.map{gap:5px}
.map .cell{padding:5px;gap:4px;min-height:48px}
.map .chip{padding:4px 7px}
.map .hd{padding:2px 2px 4px}
.step{flex:1;min-width:0;background:var(--card);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;border-top:3px solid var(--line)}
.step.cut{border-top-color:var(--or);background:#1d2c45}
.sw{font-size:11.5px;font-weight:700;color:var(--or)}
.sx{font-size:13.5px;font-weight:700}
.tools{display:flex;flex-direction:column;gap:4px}
.cutnote{font-size:11.5px;color:var(--or);margin-top:auto}
.arr{align-self:center;color:var(--or);font-size:20px;font-weight:800;flex:0 0 auto}
.buys{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.minis{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.mini{font-size:11px;background:var(--card2);border-radius:3px;padding:1px 6px;cursor:pointer;color:var(--sub)}
.mini:hover,.mini:focus-visible{color:var(--tx);outline:1px solid var(--or)}
.plan{grid-template-columns:.95fr 1.1fr 1.3fr}
.map .cell{gap:3px}
.map .chip{padding:2px 7px;line-height:1.3}
.map .hd{font-size:12px}
@media (max-width:900px){
  .flow{flex-direction:column}
  .arr{transform:rotate(90deg)}
  .map{grid-template-columns:52px repeat(var(--cols),minmax(130px,1fr))}
}
</style>

</head>
<body>
<div class="prog" id="prog"></div>
<nav class="dots" id="dots" aria-label="장 이동"></nav>
<main id="app"></main>
<div class="mb" id="mb" role="dialog" aria-modal="true" aria-labelledby="mdT"><div class="md" id="md"></div></div>

<script>
/* =====================================================================
   설정·데이터 블록 — 내용 수정은 여기만. 아래 엔진부는 건드리지 않아도 됨
   ===================================================================== */
const META = {

};
const PAINS = ["시간","품질","몸","환경","사고","소통"];
const PAIN_DESC = {"시간":"측정·피스·재작업 시간","품질":"간극·조건 이탈·R","몸":"진동·근골격계","환경":"흄·분진·소음·열","사고":"추락·질식·쓰러짐","소통":"외국인 작업자 언어"};

/* 장 제목·설명 — {N} {BUY} {SELF} {PROOF} {BODY} {TOP} 은 ITEMS에서 자동 집계 */
const TEXT = {
  h1: "직종마다 하나씩, 2주 시범으로 바로 넣을 것 {TOP}건",

  h3: "사상 일을 가장 크게 줄이는 손잡이는 사상이 아니라 취부에 있다",
  l3: "임시 피스 하나가 용접·제거·그라인딩 세 번의 일을 만든다. 미 해군 조선소 연구도 그라인딩 감축 기회로 '그라인딩이 필요 없는 임시 부착물'을 꼽았다.",
  h4: "직종별 {N}건 — 탭으로 보고, 행을 누르면 근거·제품·주의점",

/* 아이템 — trade: 직종 · pain: 줄이는 것(첫 번째가 주) · buy: 구매 경로 · proof: 조선소 근거 · own: 삼성중공업 사내(운용/시범/없음) · top: 우선 시범 */
const ITEMS = [

    cases:[
      { who:"LAP (조선 적용 페이지)", year:"제조사", what:"요트 데크·선체 내장품·격벽 배치 투사 사례. 상선 블록 조립공장 공개 사례는 못 찾음", short:"요트 사례뿐, 상선 블록 사례 미확인", effect:"", srcName:"LAP", src:"https://www.lap-laser.com/industry/shipbuilding/" },
      { who:"LAP (철골 제작)", year:"제조사", what:"철골 작업대에서 수작업 마킹·측정 대체", effect:"기존 방식 대비 최대 70% 빠름 (제조사 발표, 철골 기준)", srcName:"LAP", src:"https://www.lap-laser.com/company/news/detail/creating-efficiency-with-laser-projection-for-steel-fabrication/" },

    vendors:[
      { name:"LAP CAD-PRO", url:"https://www.lap-laser.com/products/cad-pro/", ch:"국내 대리점 미확인" },
      { name:"Virtek Iris 3D", url:"https://virtekvision.com/products/virtek-iris-3d", ch:"국내 대리점 미확인" },

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pfB = p => `<span class="pf pf-${p}" title="${esc(PF_DESC[p])}">${PF_LABEL[p]}</span>`;
const ownB = o => o === "운용" || o === "시범" ? `<span class="ow ow-${o}" title="${esc(OWN_DESC[o])}">사내 ${o}</span>` : "";
const buyB = b => `<span class="ct"><i style="background:${BUY_COLOR[b]}"></i>${esc(b)}</span>`;
const trB = t => `<span class="trd">${esc(t)}</span>`;
const pnB = p => `<span class="pn">${esc(p)}</span>`;
const byId = id => ITEMS.find(i => i.id === id);
function tpl(s){
  const cnt = {
    N: ITEMS.length,
    BUY: ITEMS.filter(i => i.buy === "과 구매").length,
    SELF: ITEMS.filter(i => i.buy === "자체 제작").length,
    PROOF: ITEMS.filter(i => i.proof === "A" || i.proof === "B").length,
    BODY: ITEMS.filter(i => i.pain.some(p => p === "몸" || p === "환경" || p === "사고")).length,
    TOP: ITEMS.filter(i => i.top).length
  };
  return String(s || "").replace(/\{(\w+)\}/g, (m, k) => k in cnt ? cnt[k] : m);
}
const link = u => u ? `<a class="u" href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>` : "";
function caseLine(it){
  const c = it.cases && it.cases[0];
  if(!c) return `<span class="case">조선소 기록 못 찾음</span>`;
  const more = it.cases.length > 1 ? ` 외 ${it.cases.length - 1}건` : "";
  return `<span class="case"><b>${esc(c.who)}</b> · ${esc(c.short || c.what)}${more}</span>`;
}

  return `
    <div class="eyebrow">${esc(it.trade)} · ${esc(it.id)}</div>
    <h2 id="mdT">${it.top ? '<span class="star">★ </span>' : ""}${esc(it.name)}</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${trB(it.trade)} ${it.pain.map(pnB).join(" ")} ${pfB(it.proof)} ${buyB(it.buy)} ${ownB(it.own)}</div>
    <h4>무엇을</h4><p>${esc(it.what || it.one)}</p>
    ${it.ownNote ? `<h4>삼성중공업 사내 현황</h4><p>${esc(it.ownNote)}</p>` : ""}
    <h4>조선소 근거</h4>${cases}
    <h4>조립4과에 넣는다면</h4><p>${esc(it.apply || "")}</p>
    <h4>제품·구매처 (사내 → 외부 순)</h4>${vend}<p style="margin-top:6px"><b>첫 액션</b> — ${esc(it.first || "")}</p>
    <h4>주의점</h4><p>${esc(it.risk || "")}</p>
    <p class="hint" style="margin-top:14px;border-top:1px solid var(--line);padding-top:8px">공개 수치는 출처 표기 그대로(대부분 제조사 발표). 보고에는 시범 측정값만 쓴다. 일부 원문 미열람 — 인용 전 링크 대조.</p>`;
}

/* modal */
const mb = document.getElementById("mb"), md = document.getElementById("md");
let lastFocus = null;
function openItem(id){
  const it = byId(id); if(!it) return;
  lastFocus = document.activeElement;
  md.innerHTML = `<button class="x" aria-label="닫기">×</button>` + detailHTML(it);
  mb.classList.add("on"); md.scrollTop = 0; md.querySelector(".x").focus();
}
function closeModal(){ mb.classList.remove("on"); if(lastFocus) lastFocus.focus(); }
mb.addEventListener("click", e => { if(e.target === mb || e.target.classList.contains("x")) closeModal(); });

/* tabs */
function setTab(t){
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tr === t));
  document.querySelectorAll("table.it tbody tr").forEach(r => r.style.display = r.dataset.tr === t ? "" : "none");
  const h = document.getElementById("trHint"); if(h) h.textContent = TRADE_DESC[t];
}

/* nav */
function secs(){ return [...document.querySelectorAll("section.pg")]; }
function curIdx(){
  const y = window.scrollY + window.innerHeight * 0.4; let k = 0;
  secs().forEach((s, i) => { if(s.offsetTop <= y) k = i; }); return k;
}
function go(i){ const s = secs(); i = Math.max(0, Math.min(s.length - 1, i)); const rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches; s[i].scrollIntoView({behavior: rm ? "auto" : "smooth"}); }
function syncNav(){
  const k = curIdx();
  document.querySelectorAll("#dots button").forEach((b, i) => b.classList.toggle("on", i === k));
  const max = document.documentElement.scrollHeight - window.innerHeight;
  document.getElementById("prog").style.width = (max > 0 ? window.scrollY / max * 100 : 0) + "%";
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-id]"); if(t && !mb.classList.contains("on")) { openItem(t.dataset.id); return; }
  const tb = e.target.closest(".tab"); if(tb) setTab(tb.dataset.tr);
});
document.addEventListener("keydown", e => {
  if(mb.classList.contains("on")){ if(e.key === "Escape") closeModal(); return; }
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
  if(e.key === "Enter" && e.target.dataset && e.target.dataset.id){ openItem(e.target.dataset.id); return; }
  if(window.matchMedia("(max-width:900px)").matches) return;
  if(e.key === "PageDown" || (e.key === " " && !e.shiftKey)){ e.preventDefault(); go(curIdx() + 1); }
  else if(e.key === "PageUp" || (e.key === " " && e.shiftKey)){ e.preventDefault(); go(curIdx() - 1); }
  else if(e.key === "Home"){ e.preventDefault(); go(0); }
  else if(e.key === "End"){ e.preventDefault(); go(secs().length - 1); }
});
window.addEventListener("scroll", syncNav, {passive:true});
window.addEventListener("beforeprint", () => document.querySelectorAll("table.it tbody tr").forEach(r => r.style.display = ""));
window.addEventListener("afterprint", () => setTab(document.querySelector('.tab[aria-selected="true"]')?.dataset.tr || TRADES[0]));

render();
document.getElementById("dots").innerHTML = secs().map((s, i) => `<button aria-label="${i+1}장 ${esc(s.dataset.t)}" title="${esc(s.dataset.t)}"></button>`).join("");
document.querySelectorAll("#dots button").forEach((b, i) => b.addEventListener("click", () => go(i)));
setTab(TRADES[0]); syncNav();
</script>
</body>
</html>
