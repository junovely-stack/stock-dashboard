<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}생활정리 큐레이션{% endblock %}</title>
<meta name="description" content="좁은 방·책상·수납 문제를 해결하는 생활용품을 장단점과 주의사항까지 정리합니다. 쿠팡 파트너스 제휴 링크가 포함됩니다.">
<link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body data-product="{% block product_id %}{% endblock %}" data-content="{% block content_id %}{% endblock %}" data-src="{% block src %}direct{% endblock %}">
<div class="ad-bar"><b>광고</b> · 이 사이트의 상품 링크는 쿠팡 파트너스 제휴 링크이며, 구매 시 운영자가 일정액의 수수료를 받습니다.</div>
{% if any_demo %}<div class="demo-bar">DEMO 데이터 — 실제 판매 상품·가격이 아닌 예시입니다</div>{% endif %}
<header class="site">
  <a class="brand" href="{{ url_for('public.index') }}">생활정리<span>.</span></a>
  <nav aria-label="주요 메뉴">
    <a href="{{ url_for('public.index') }}">오늘의 추천</a>
    <a href="{{ url_for('public.disclosure_page') }}">광고·제휴 안내</a>
  </nav>
</header>
<main>{% block main %}{% endblock %}</main>
<footer class="site">
  <p>{{ disclosure.landing_notice }}</p>
  <p><a href="{{ url_for('public.disclosure_page') }}">광고·제휴 안내</a>|<a href="{{ url_for('public.privacy') }}">개인정보 처리방침</a></p>
</footer>
<script src="{{ url_for('static', filename='js/track.js') }}"></script>
</body>
</html>
