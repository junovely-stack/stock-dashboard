# 광고 표시·금칙어·제외 상품 정책
# 실제 문구·위치는 최신 쿠팡파트너스 약관과 공정위 심사지침으로 최종 확인할 것 (docs/COMPLIANCE_CHECKLIST.md).

[disclosure]
# 쿠팡파트너스 가이드 예시 문구 (partners.coupang.com/api/v1/partners-guide 검색 색인 기준 '게시물' 표기, 2026-11-18 조사)
# 공정위 심사지침(2024-12-01 개정): "수수료를 지급받을 수 있음" 같은 조건부·불확정 표현은 명확한 표시가 아님 → 사용 금지
coupang_required = "이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."
# 영상 첫 화면에 크게 띄우는 짧은 표시
video_badge = "광고"
video_opening = "광고 · 쿠팡 파트너스 활동으로 수수료를 받습니다"
# 캡션 첫 줄 (더보기 전에 보이는 위치)
caption_first_line = "[광고] 쿠팡 파트너스 활동으로 수수료를 제공받습니다."
youtube_title_prefix = "[광고]"
landing_notice = "이 페이지에는 쿠팡 파트너스 제휴 링크가 있으며, 링크를 통해 구매하면 운영자가 일정액의 수수료를 받습니다. 구매자가 내는 가격은 같습니다."
ai_notice = "일부 배경·장면은 AI 또는 그래픽으로 만든 연출 이미지입니다. 상품 자체는 판매처 정보 기준입니다."

# 표시 문구 자체에 들어가면 안 되는 표현 (조건부·외국어 약어)
disclosure_forbidden = ["받을 수 있", "지급받을 수", "제공받을 수", "AD", "PR", "체험단", "서포터즈"]
# 영상 전체가 추천·보증이면 시작·끝 + 중간 반복 표시 → 전 장면 '광고' 배지 + 첫 장면 문구 + 엔드카드 문구
video_repeat_badge = true
# 해시태그를 쓰면 #광고 가 첫 번째 해시태그
first_hashtag = "#광고"
# AI 가상인물 등장 시 (공정위 2026-06-01 시행) 해당 인물 옆 '가상인물' 표시 — MVP 는 AI 인물 미사용
virtual_person_label = "가상인물"

[banned_phrases]
# 사유별 금칙어. 영상 자막·내레이션·캡션·랜딩 문구 모두 검사한다.
absolute = ["무조건", "100%", "완벽", "절대", "평생", "영구", "모든 문제", "누구나 만족"]
superlative_unverified = ["최저가", "역대급", "1위", "최고의", "업계 최초", "국내 유일"]
false_scarcity = ["품절 임박", "마감 임박", "오늘만", "한정 수량", "곧 품절", "마지막 기회", "지금 아니면"]
pressure = ["지금 바로 구매", "당장 사세요", "놓치면 후회", "안 사면 손해"]
medical_efficacy = ["치료", "효능", "의학적", "질병", "살균 99", "항균 99", "면역", "부작용 없"]
fake_social_proof = ["후기 폭발", "다들 산다", "모두가 쓰는", "리뷰 1만", "판매량 1위"]
comparative_unverified = ["다른 제품보다", "타사 대비", "경쟁사보다"]
# 직접 사용 경험 주장 — 실제로 써본 기록(signals.own_usage_verified=true)이 있을 때만 허용
experience_claims = ["써보니", "써봤", "직접 써", "내돈내산", "사용해보니", "한 달 써", "바꿔보니"]

[claim_units]
# 이 단위가 붙은 숫자는 검증 사양과 일치해야 통과
units = ["cm", "mm", "m", "kg", "g", "W", "V", "mAh", "L", "ml", "개입", "단", "칸", "구", "%", "시간", "분", "초", "원", "매", "인치"]
# 영상·캡션에 금액·할인율 표기 금지 (가격은 변동 → 랜딩에서 확인 시각과 함께만 표시)
forbid_in_video = ["원", "%"]

[excluded]
# 규제·위험이 커서 MVP 에서 다루지 않는 영역
categories = ["건강기능식품", "의약외품", "의료기기", "화장품_기능성", "유아용_카시트", "전기난방기기", "도검", "주류", "담배"]
risk_keywords = ["다이어트", "탈모", "면역", "살균제", "락스", "가스", "난로", "전기장판", "흡연", "카시트", "의료"]

[psychology]
allowed_levers = ["손실 회피", "선택 피로 감소", "후회 회피", "즉각적인 효용", "시각적인 변화", "사용 후 상황 상상", "시간 절약 욕구", "공간 확보 욕구", "생활의 통제감", "인정·자존감", "안전하고 합리적인 선택", "구매 후 관리 부담 감소"]
max_levers = 2
